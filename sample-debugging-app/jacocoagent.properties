# Configuration for profiling the sample-debugging-app, see docs/DEBUGGING.md.
#
# This file is committed, so do NOT put credentials in it. To talk to a real Teamscale instance, copy it to
# jacocoagent.local.properties (git-ignored) and fill in the values there; the run task prefers that file if present.

includes=*com.example.*
logging-config=../agent/src/dist/logging/logback.console.xml

# Uncomment and complete the following to upload coverage to a local Teamscale instance.
# teamscale-server-url=http://127.0.0.1:9999/teamscale/
# teamscale-project=<project id from the Teamscale UI>
# teamscale-user=admin
# teamscale-access-token=<generate under avatar > Access Keys>
# teamscale-partition=Agent Debugging
# teamscale-commit=master:HEAD
